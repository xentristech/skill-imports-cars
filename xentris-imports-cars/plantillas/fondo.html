<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.foto{position:absolute;inset:0;background:url(car.jpg) center right/cover no-repeat}
.velo{position:absolute;inset:0;background:
  linear-gradient(90deg,#151719 0%,#151719 22%,rgba(21,23,25,.75) 40%,rgba(21,23,25,0) 62%),
  linear-gradient(0deg,rgba(21,23,25,.95) 0%,rgba(21,23,25,.4) 22%,rgba(21,23,25,0) 45%)}
.glow{background:
  radial-gradient(ellipse 900px 520px at 78% 8%,rgba(227,6,19,.55),rgba(227,6,19,0) 70%),
  radial-gradient(ellipse 1400px 300px at 50% 100%,rgba(227,6,19,.35),rgba(227,6,19,0) 70%)}
.logo{position:absolute;left:150px;top:300px;width:1120px}
.logo img{width:100%;display:block}
.nombre{position:absolute;left:156px;top:560px}
.nombre .lbl{font-size:24px;margin-bottom:14px;color:#E30613;opacity:1}
.nombre h1{font-size:92px;line-height:1;white-space:nowrap}
.nombre h1 .ext{transform:scaleX(1.08)}
.claim{position:absolute;left:156px;top:730px;max-width:900px;font-size:30px;font-weight:300;line-height:1.35;opacity:.8}
.claim b{font-weight:600;color:#F2F4F3}
.linea{position:absolute;left:156px;top:690px;width:140px;height:4px;background:#E30613}
.pie{position:absolute;right:80px;bottom:60px;text-align:right}
.pie .lbl{font-size:20px;opacity:.6}
</style></head><body>
<div class="foto"></div><div class="velo"></div><div class="glow"></div>
<div class="meta"><span>Imports Cars</span><span>2026</span><span>Compra · Venta · Permuta</span></div>
<div class="logo"><img src="logo-importscars.png" alt="Imports Cars"></div>
<div class="nombre"><div class="lbl">Importación de alta gama</div><h1><span class="ext">{{NOMBRE}}</span></h1></div>
<div class="linea"></div>
<div class="claim">Entregas <b>inmediatas y confiables</b>.<br>Cada vehículo que entregamos es más que una venta.</div>
<div class="pie"><div class="lbl">Respaldo <span class="dot"></span> Confianza <span class="dot"></span> Elegancia</div></div>
<div class="grain"></div>
</body></html>
