<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.glow{background:
  radial-gradient(ellipse 1300px 700px at 30% 100%,rgba(227,6,19,.6),rgba(227,6,19,0) 70%),
  radial-gradient(ellipse 900px 500px at 95% 0%,rgba(227,6,19,.3),rgba(227,6,19,0) 70%)}
.poster{position:absolute;left:220px;top:120px;height:1200px;box-shadow:0 60px 140px rgba(0,0,0,.7)}
.poster img{height:100%;display:block;border-radius:6px}
.der{position:absolute;right:160px;top:380px;width:1000px;text-align:right}

.pill{display:inline-block;padding:10px 28px;border:2px solid #E30613;border-radius:999px;font-family:Bahnschrift;letter-spacing:.3em;font-size:22px;text-transform:uppercase;color:#F2F4F3;margin-bottom:34px}
.der h1{font-size:120px;line-height:.95}
.der h1 .ext{transform:scaleX(1.1);transform-origin:right center}
.der p{margin:40px 0 0 auto;font-size:30px;font-weight:300;opacity:.75;line-height:1.4;max-width:820px}

<div class="glow"></div>
<div class="meta"><span>Imports Cars</span><span>Highlights 2026</span><span>Compra · Venta · Permuta</span></div>

</body></html>
